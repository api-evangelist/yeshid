aid: yeshid
name: YeshID
description: 'YeshID is an AI-native workforce identity and access control platform that
  helps IT and security teams understand, govern, and automate access across fragmented
  SaaS apps, identity providers, OAuth grants, service accounts, non-human identities,
  AI agents, app-local permissions, and lifecycle workflows. Rather than starting at
  login, YeshID focuses on effective access — the roles, admin privileges, API tokens,
  and SaaS-to-SaaS connections that people and machines actually hold — powering
  onboarding/offboarding, access requests, access reviews, and remediation for SMB
  and mid-market teams.'
